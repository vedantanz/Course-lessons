<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bounded Moment · How Long a Knowing Has to Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root{
    --ink:#070B16; --mist:#101830; --line:#24304F; --parchment:#E8E3D5;
    --dim:#9AA1B5; --gold:#E3B458; --gold-soft:rgba(227,180,88,0.14);
    --violet:#8E7CF3; --cyan:#5BC8DD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--parchment);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(142,124,243,0.07), transparent),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(227,180,88,0.05), transparent);
    background-attachment:fixed;
  }
  .display{font-family:'Cormorant Garamond',Georgia,serif;}
  .shell{min-height:100vh; display:flex; flex-direction:column;}

  header.bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 22px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:6px;
  }
  header.bar .deck{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:17px; color:var(--gold);}
  header.bar .count{font-size:11px; color:var(--dim); letter-spacing:0.08em; font-variant-numeric:tabular-nums;}

  main.stage{
    flex:1; display:flex; align-items:flex-start; justify-content:center;
    padding:32px 20px; overflow-y:auto;
  }
  main.stage > div{width:100%; max-width:920px;}

  footer.bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 20px; border-top:1px solid var(--line); gap:10px; flex-wrap:wrap;
  }
  .btn{
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    padding:9px 20px; border-radius:24px; font-size:13px; letter-spacing:0.04em;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn.solid{background:var(--gold); color:var(--ink); font-weight:500;}
  .btn:disabled{border-color:var(--line); color:var(--dim); background:transparent; opacity:0.4; cursor:default;}
  .dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .dot{width:8px; height:8px; border-radius:4px; border:none; background:var(--line); padding:0; cursor:pointer; transition:all 0.25s ease;}
  .dot.on{width:24px; background:var(--gold);}
  .dot:hover{background:var(--gold);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .fade{animation:fadeIn 0.7s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;}}

  .eyebrow{font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; font-weight:500;}
  h1.cover-title{font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:clamp(40px,6.6vw,68px); line-height:1.06; margin:0 0 10px;}
  .cover-sub{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:clamp(17px,2.5vw,25px); color:var(--gold); margin-bottom:28px;}
  h2.slide-title{font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(27px,5.2vw,44px); line-height:1.15; color:var(--parchment); font-weight:500; margin:0 0 18px; overflow-wrap:break-word;}
  p.body{font-size:15px; line-height:1.75; color:var(--dim); margin:0 0 15px; max-width:720px;}
  .gold{color:var(--gold);}
  .light{color:var(--parchment);}
  .card{background:var(--mist); border:1px solid var(--line); border-radius:10px; padding:18px 20px;}
  h3.card-title{font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:21px; margin:0 0 8px; color:var(--parchment);}
  p.card-text{font-size:13.5px; color:var(--dim); line-height:1.7; margin:0;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
  .micro{font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin-bottom:4px;}
  /* Greek and symbols must not be uppercased: Delta f would become ΔF, 1/pi would become 1/Π.
     The second rule is needed where .nc sits on the same element as a two-class selector. */
  .nc{text-transform:none;}
  .readout .k.nc, table.nums th.nc, .micro.nc{text-transform:none;}
  .range-labels{display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin-top:5px; gap:8px; flex-wrap:wrap;}
  input[type=range]{accent-color:var(--gold); width:100%; margin-top:14px;}
  .plain, .note{padding:13px 17px; border-radius:0 8px 8px 0; font-size:13.5px; line-height:1.7; color:var(--parchment); max-width:720px; margin-top:12px;}
  .plain{border-left:2px solid var(--cyan); background:rgba(91,200,221,0.08);}
  .note{border-left:2px solid var(--gold); background:var(--gold-soft);}
  .plain .tag{color:var(--cyan); font-weight:600; letter-spacing:0.08em; font-size:11px; text-transform:uppercase;}
  .note .tag{color:var(--gold); font-weight:600; letter-spacing:0.08em; font-size:11px; text-transform:uppercase;}
  .live{font-size:13px; color:var(--parchment); margin:14px 0 0; line-height:1.65;}
  canvas{width:100%; display:block;}

  .meter-label{font-size:11.5px; color:var(--dim); margin-bottom:3px;}
  .meter{height:10px; border-radius:5px; background:var(--line); overflow:hidden;}
  .meter > span{display:block; height:10px; border-radius:5px; transition:width 0.12s ease;}
  .readout{display:flex; flex-wrap:wrap; gap:8px 26px; margin-top:14px;}
  .readout .k{font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:2px;}
  .readout .v{font-size:17px; font-variant-numeric:tabular-nums; color:var(--parchment); font-family:'Cormorant Garamond',Georgia,serif;}
  .readout .v.hi{color:var(--gold);}

  table.nums{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px;}
  table.nums th{text-align:left; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); font-weight:500; padding:8px 12px 8px 0; border-bottom:1px solid var(--line);}
  table.nums td{padding:9px 12px 9px 0; border-bottom:1px solid var(--line); color:var(--dim); font-variant-numeric:tabular-nums;}
  table.nums td.first{color:var(--parchment);}
  table.nums tr.mark td{color:var(--gold);}

  .arc-row{display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--line);}
  .arc-num{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:20px; color:var(--gold); min-width:32px;}
  .arc-t{font-size:14.5px; color:var(--parchment); font-weight:500; margin-bottom:4px;}
  .arc-g{font-size:13px; color:var(--dim); line-height:1.7;}
  .rule-row{display:flex; gap:16px; padding:13px 0; border-bottom:1px solid var(--line);}
  .rule-key{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; color:var(--gold); font-size:20px; min-width:112px;}
  .rule-val{font-size:13.5px; color:var(--dim); line-height:1.65;}
  .foot-note{font-size:12.5px; color:var(--dim); margin-top:20px; line-height:1.7;}
  .eq{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:18px; color:var(--parchment); line-height:1.6;}
  .eq .op{font-style:normal; color:var(--dim);}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="deck">The Bounded Moment</div>
    <div class="count" id="count"></div>
  </header>
  <main class="stage"><div id="stage"></div></main>
  <footer class="bar">
    <button class="btn" id="prev">&#8592; Previous</button>
    <div class="dots" id="dots"></div>
    <button class="btn solid" id="next">Next &#8594;</button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var C={ink:"#070B16",mist:"#101830",line:"#24304F",parchment:"#E8E3D5",dim:"#9AA1B5",gold:"#E3B458",violet:"#8E7CF3",cyan:"#5BC8DD"};
  var FLOOR=1/(4*Math.PI);
  var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rafs=[];

  /* ---------- canvas helper ---------- */
  function paint(cv,height,drawFn){
    function render(){
      var dpr=window.devicePixelRatio||1, w=cv.clientWidth||320;
      cv.style.height=height+"px";
      cv.width=w*dpr; cv.height=height*dpr;
      var ctx=cv.getContext("2d");
      ctx.setTransform(dpr,0,0,dpr,0,0);
      drawFn(ctx,w,height);
    }
    render();
    cv._render=render;
    return render;
  }
  function baseline(ctx,w,mid){
    ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid);
    ctx.strokeStyle="rgba(154,161,181,0.18)"; ctx.lineWidth=1; ctx.stroke();
  }
  function label(ctx,text,x,y,color,align){
    ctx.fillStyle=color; ctx.font="11px Inter, system-ui, sans-serif";
    ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(text,x,y);
  }

  /* ---------- the mathematics ---------- */
  /* Gaussian-windowed two-tone analytic signal.
     |x(t)|^2 = w^2 (2 + 2cos(2 pi Df t)),  w = exp(-t^2 / 2T^2)
     |X(f)|^2 = ( W(f - Df/2) + W(f + Df/2) )^2,  W(f) = exp(-2 pi^2 T^2 f^2)
     Energy-moment standard deviations by quadrature. Verified against an
     independent implementation: Df = 0 lands on 1/4pi exactly; T*Df = 1 gives 4.55x. */
  function moments(T,Df){
    var N=1400,i,t,w,e,f,a;
    var tSpan=8*T, sw=0, s2=0;
    for(i=0;i<=N;i++){
      t=-tSpan+(2*tSpan*i)/N;
      w=Math.exp(-(t*t)/(2*T*T));
      e=w*w*(2+2*Math.cos(2*Math.PI*Df*t));
      sw+=e; s2+=t*t*e;
    }
    var sigT=Math.sqrt(s2/sw);
    var lw=1/(2*Math.PI*T), fSpan=8*lw+Df, sw2=0, s2f=0;
    for(i=0;i<=N;i++){
      f=-fSpan+(2*fSpan*i)/N;
      a=Math.exp(-2*Math.PI*Math.PI*T*T*Math.pow(f-Df/2,2))
       +Math.exp(-2*Math.PI*Math.PI*T*T*Math.pow(f+Df/2,2));
      e=a*a; sw2+=e; s2f+=f*f*e;
    }
    return {dt:sigT, df:Math.sqrt(s2f/sw2), prod:sigT*Math.sqrt(s2f/sw2)};
  }
  /* For a Gaussian window the energy spectrum acquires a dip at the midpoint
     exactly when pi * T * Df > 1. Below that it has a single maximum. */
  function separable(T,Df){ return T*Df > 1/Math.PI; }

  /* ---------- reusable panels ---------- */
  function drawWindowedTime(ctx,w,h,T,Df,fc){
    var mid=h/2, amp=h*0.38, tMax=3.2*T, i;
    ctx.clearRect(0,0,w,h);
    /* the episode's window */
    ctx.setLineDash([5,4]); ctx.lineWidth=1.2; ctx.strokeStyle="rgba(227,180,88,0.55)";
    [1,-1].forEach(function(sg){
      ctx.beginPath();
      for(i=0;i<=w;i++){
        var t=-tMax+(i/w)*2*tMax;
        var y=mid-sg*Math.exp(-(t*t)/(2*T*T))*amp;
        i===0?ctx.moveTo(i,y):ctx.lineTo(i,y);
      }
      ctx.stroke();
    });
    ctx.setLineDash([]);
    /* the beat envelope inside it */
    ctx.lineWidth=1.3; ctx.strokeStyle="rgba(227,180,88,0.95)";
    [1,-1].forEach(function(sg){
      ctx.beginPath();
      for(i=0;i<=w;i++){
        var t=-tMax+(i/w)*2*tMax;
        var env=Math.exp(-(t*t)/(2*T*T))*Math.cos(2*Math.PI*(Df/2)*t);
        var y=mid-sg*env*amp;
        i===0?ctx.moveTo(i,y):ctx.lineTo(i,y);
      }
      ctx.stroke();
    });
    /* the resultant */
    ctx.beginPath();
    for(i=0;i<=w;i++){
      var t2=-tMax+(i/w)*2*tMax;
      var r=Math.exp(-(t2*t2)/(2*T*T))*Math.cos(2*Math.PI*(Df/2)*t2)*Math.cos(2*Math.PI*fc*t2);
      var y2=mid-r*amp;
      i===0?ctx.moveTo(i,y2):ctx.lineTo(i,y2);
    }
    ctx.strokeStyle="rgba(232,227,213,0.92)"; ctx.lineWidth=1.4; ctx.stroke();
    baseline(ctx,w,mid);
  }
  function drawWindowedSpectrum(ctx,w,h,T,Df){
    var pad={l:14,r:14,t:16,b:22};
    var iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, baseY=pad.t+ih, i;
    ctx.clearRect(0,0,w,h);
    var lw=1/(2*Math.PI*T);
    var span=3.4*Math.max(Df,2.2*lw);
    var k=2*Math.PI*Math.PI*T*T;
    function xOf(fo){ return pad.l+((fo+span)/(2*span))*iw; }
    function energy(fo){
      var a=Math.exp(-k*Math.pow(fo-Df/2,2))+Math.exp(-k*Math.pow(fo+Df/2,2));
      return a*a;
    }
    var vals=[], peak=0;
    for(i=0;i<=iw;i++){
      var v=energy(-span+(i/iw)*2*span);
      vals.push(v); if(v>peak) peak=v;
    }
    /* fill */
    ctx.beginPath(); ctx.moveTo(pad.l,baseY);
    for(i=0;i<=iw;i++) ctx.lineTo(pad.l+i, baseY-(vals[i]/peak)*ih);
    ctx.lineTo(w-pad.r,baseY); ctx.closePath();
    ctx.fillStyle="rgba(142,124,243,0.16)"; ctx.fill();
    /* stroke */
    ctx.beginPath();
    for(i=0;i<=iw;i++){
      var y=baseY-(vals[i]/peak)*ih;
      i===0?ctx.moveTo(pad.l+i,y):ctx.lineTo(pad.l+i,y);
    }
    ctx.strokeStyle=C.violet; ctx.lineWidth=1.7; ctx.stroke();
    /* the two poles */
    ctx.setLineDash([2,3]); ctx.strokeStyle="rgba(154,161,181,0.45)"; ctx.lineWidth=1;
    [-Df/2,Df/2].forEach(function(fo){
      ctx.beginPath(); ctx.moveTo(xOf(fo),pad.t); ctx.lineTo(xOf(fo),baseY); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(pad.l,baseY); ctx.lineTo(w-pad.r,baseY);
    ctx.strokeStyle="rgba(154,161,181,0.18)"; ctx.stroke();
    if(Df>0.02){
      label(ctx,"fₘ",xOf(-Df/2),baseY+13,C.dim,"center");
      label(ctx,"fₛ",xOf(Df/2),baseY+13,C.dim,"center");
    } else {
      label(ctx,"fₛ = fₘ",xOf(0),baseY+13,C.dim,"center");
    }
    var sep=separable(T,Df);
    label(ctx, sep?"two maxima":"one maximum", w-pad.r, pad.t+6, sep?C.violet:C.dim, "right");
  }

  /* ---------- slides ---------- */
  var SLIDES=[];

  /* 00 cover */
  SLIDES.push({id:"cover", label:"The Bounded Moment", html:
    '<div class="fade" style="text-align:center;max-width:860px;margin:0 auto;">'+
    '<div class="eyebrow">A Science Companion &middot; Ritam Wellbeing Framework</div>'+
    '<h1 class="cover-title">The Bounded Moment</h1>'+
    '<div class="cover-sub">How long a knowing has to last</div>'+
    '<div style="max-width:600px;margin:0 auto 18px auto;"><canvas id="coverCv" aria-hidden="true"></canvas></div>'+
    '<p class="body" style="font-size:13.5px;max-width:580px;margin:0 auto;">'+
    'Three presentations built the picture: the limit and the logon, the two waves and their beat, the reference beam that records them. '+
    'This one asks the question none of them could. A moment of experience begins and ends, so how long must it last for it to hold '+
    '<span class="light">the difference it seems to hold</span>? The answer is a number, and it has a consequence for every brief taste of stillness.'+
    '</p></div>',
    init:function(){
      var cv=document.getElementById("coverCv"); if(!cv) return;
      var t0=null;
      function draw(phase){
        var dpr=window.devicePixelRatio||1, w=cv.clientWidth||320, h=150;
        cv.style.height=h+"px"; cv.width=w*dpr; cv.height=h*dpr;
        var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
        var T=0.9+0.55*Math.sin(phase*0.5);
        drawWindowedTime(ctx,w,h,T,1.1,7/Math.max(T,0.3));
      }
      if(reduced){ draw(0); return; }
      function loop(ts){ if(t0===null) t0=ts; draw((ts-t0)/1000); rafs.push(requestAnimationFrame(loop)); }
      rafs.push(requestAnimationFrame(loop));
    }});

  /* 01 where we are */
  SLIDES.push({id:"where", label:"Where We Are", html:
    '<div class="fade">'+
    '<div class="eyebrow">01 &middot; Where We Are</div>'+
    '<h2 class="slide-title">What the first three left us</h2>'+
    '<p class="body">Each of the three earlier presentations handed us one piece. Put together they describe a moment of knowing, '+
    'but they describe it as though it had no edges in time. That is the gap this presentation closes.</p>'+
    '<div class="grid" style="margin:6px 0 16px 0;">'+
    '<div class="card"><h3 class="card-title">The Whole Message</h3><p class="card-text">Gabor\'s limit: sharpness in time and in frequency cannot both be had. '+
    'The most efficient grain of information is a <span class="gold">logon</span>, a pure tone inside a bell-shaped envelope, sitting exactly on the limit.</p></div>'+
    '<div class="card"><h3 class="card-title">The Settling Mind</h3><p class="card-text">Experience as the meeting of two waves, what is there and what you bring. Their sum has a hidden anatomy: '+
    'a <span class="gold">carrier</span> bearing the content and an <span class="gold">envelope</span> bearing the felt clarity, beating at the gap between them.</p></div>'+
    '<div class="card"><h3 class="card-title">The Light and the Field</h3><p class="card-text">Attention read as the reference beam. Interference is what preserves phase, '+
    'which is why anything is recorded at all, and why recall asks for attention to be re-applied.</p></div>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>We have a picture of what a moment of knowing is made of. '+
    'What we have not yet asked is what it costs that moment to be a moment: to start, to last a while, and to pass.</div>'+
    '</div>'});

  /* 02 the logon, live */
  SLIDES.push({id:"logon", label:"The Logon", html:
    '<div class="fade">'+
    '<div class="eyebrow">02 &middot; The Logon</div>'+
    '<h2 class="slide-title">A bounded packet, sitting on the limit</h2>'+
    '<p class="body">Strike a piano key for a split second and you get a thud with no clear pitch. Hold it and the pitch arrives, but the moment smears. '+
    'A frequency is a rate, and a rate needs a stretch of time in which to be a rate. Gabor made that exact: the spread in time and the spread in frequency '+
    'have a product that cannot fall below <span class="gold">1/4&pi;</span>.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro">a logon = carrier &times; envelope</div>'+
    '<canvas id="logonCv" aria-hidden="true"></canvas>'+
    '<input type="range" id="logonS" min="0.35" max="3" step="0.01" value="1.1" aria-label="Widen or narrow the envelope">'+
    '<div class="range-labels"><span>&#8592; brief and broad-band</span><span>long and narrow-band &#8594;</span></div>'+
    '<div style="margin-top:16px;">'+
    '<div class="meter-label">&Delta;t, spread in time</div>'+
    '<div class="meter"><span id="logonBarT" style="background:var(--gold);"></span></div>'+
    '<div class="meter-label" style="margin-top:10px;">&Delta;f, spread in frequency</div>'+
    '<div class="meter"><span id="logonBarF" style="background:var(--cyan);"></span></div>'+
    '</div>'+
    '<div class="readout"><div><span class="k nc">&Delta;t &middot; &Delta;f</span><span class="v hi" id="logonProd">0.0796</span></div>'+
    '<div><span class="k">the floor, <span class="nc">1/4&pi;</span></span><span class="v">0.0796</span></div></div>'+
    '<p class="live" id="logonMsg"></p>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>Drag the slider and watch the two bars trade against each other. '+
    'Whatever you choose, the product stays pinned to the floor. A logon is not efficient at one particular duration; it is as efficient as anything can be at every duration.</div>'+
    '</div>',
    init:function(){
      var cv=document.getElementById("logonCv"), sl=document.getElementById("logonS");
      function render(){
        var s=parseFloat(sl.value);
        var dt=s/Math.SQRT2, df=1/(2*Math.SQRT2*Math.PI*s);
        paint(cv,130,function(ctx,w,h){
          var mid=h/2, amp=h*0.4, sg=s*w*0.115, freq=20, i;
          ctx.clearRect(0,0,w,h);
          ctx.beginPath();
          for(i=0;i<=w;i++){ var g=Math.exp(-Math.pow(i-w/2,2)/(2*sg*sg)); ctx.lineTo(i,mid-g*amp); }
          for(i=w;i>=0;i--){ var g2=Math.exp(-Math.pow(i-w/2,2)/(2*sg*sg)); ctx.lineTo(i,mid+g2*amp); }
          ctx.closePath(); ctx.fillStyle="rgba(227,180,88,0.06)"; ctx.fill();
          ctx.setLineDash([5,4]); ctx.strokeStyle="rgba(227,180,88,0.6)"; ctx.lineWidth=1.2;
          [1,-1].forEach(function(k){
            ctx.beginPath();
            for(i=0;i<=w;i++){ var g3=Math.exp(-Math.pow(i-w/2,2)/(2*sg*sg)); var y=mid-k*g3*amp; i===0?ctx.moveTo(i,y):ctx.lineTo(i,y); }
            ctx.stroke();
          });
          ctx.setLineDash([]);
          ctx.beginPath();
          for(i=0;i<=w;i++){
            var g4=Math.exp(-Math.pow(i-w/2,2)/(2*sg*sg));
            var y2=mid-Math.sin((i/w)*Math.PI*2*freq)*g4*amp;
            i===0?ctx.moveTo(i,y2):ctx.lineTo(i,y2);
          }
          ctx.strokeStyle="rgba(232,227,213,0.9)"; ctx.lineWidth=1.4; ctx.stroke();
          baseline(ctx,w,mid);
        });
        document.getElementById("logonBarT").style.width=Math.max(4,Math.min(100,dt*45))+"%";
        document.getElementById("logonBarF").style.width=Math.max(4,Math.min(100,df*450))+"%";
        document.getElementById("logonProd").textContent=(dt*df).toFixed(4);
        var msg;
        if(s<0.55) msg="A brief packet: pinned in time, its pitch smeared across a wide band.";
        else if(s>2.4) msg="A long, unbroken packet: pitch pinned sharp, at the cost of any sharp sense of when.";
        else msg="In between. As one spread shrinks the other grows, and the product does not move.";
        document.getElementById("logonMsg").textContent=msg+" The floor is not a limit of the instrument. It is a property of bounded signals.";
      }
      sl.addEventListener("input",render); render();
    }});

  /* 03 the beat, live */
  SLIDES.push({id:"beat", label:"The Beat", html:
    '<div class="fade">'+
    '<div class="eyebrow">03 &middot; The Beat</div>'+
    '<h2 class="slide-title">Two poles, and the gap between them</h2>'+
    '<p class="body">The other object we have been using is the beat of two tones. Add them and the sum has the same silhouette as a logon, '+
    'a carrier riding inside an envelope, but here the envelope comes from the <span class="gold">gap</span> between the two frequencies. '+
    'Close the gap and the beat slows, then stops.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro nc">R(t) = 2A &middot; cos(&pi;&Delta;f t) &middot; cos(2&pi;f<sub>c</sub> t)</div>'+
    '<canvas id="beatCv" aria-hidden="true"></canvas>'+
    '<input type="range" id="beatDf" min="0" max="3" step="0.01" value="1.4" aria-label="Open or close the gap between the two frequencies">'+
    '<div class="range-labels"><span>&#8592; zero gap (one steady tone)</span><span>wide gap (rapid flutter) &#8594;</span></div>'+
    '<div class="readout"><div><span class="k">gap, <span class="nc">&Delta;f</span></span><span class="v" id="beatGap">1.40</span></div>'+
    '<div><span class="k">felt beat rate</span><span class="v hi" id="beatRate">1.40</span></div></div>'+
    '<p class="live" id="beatMsg"></p>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>This is the piano tuner\'s beat. Far from pitch it is a rough flutter; '+
    'as the string comes closer it slows to a swell; at unison it vanishes and one full tone remains.</div>'+
    '<div class="note"><span class="tag">The bridge to our work &middot; </span>In <em>The Settling Mind</em> this gap is the distance between what is there and the mind that meets it, '+
    'and the felt flicker of the beat is the felt sense of two-ness. Its ceasing is what sam&#257;dhi is described as.</div>'+
    '</div>',
    init:function(){
      var cv=document.getElementById("beatCv"), sl=document.getElementById("beatDf");
      function render(){
        var Df=parseFloat(sl.value), fc=7;
        paint(cv,140,function(ctx,w,h){
          var mid=h/2, amp=h*0.38, tMax=3.0, i;
          ctx.clearRect(0,0,w,h);
          ctx.lineWidth=1.3; ctx.strokeStyle="rgba(227,180,88,0.9)";
          [1,-1].forEach(function(sg){
            ctx.beginPath();
            for(i=0;i<=w;i++){
              var t=-tMax+(i/w)*2*tMax;
              var y=mid-sg*Math.cos(2*Math.PI*(Df/2)*t)*amp;
              i===0?ctx.moveTo(i,y):ctx.lineTo(i,y);
            }
            ctx.stroke();
          });
          ctx.beginPath();
          for(i=0;i<=w;i++){
            var t2=-tMax+(i/w)*2*tMax;
            var r=Math.cos(2*Math.PI*(Df/2)*t2)*Math.cos(2*Math.PI*fc*t2);
            var y2=mid-r*amp;
            i===0?ctx.moveTo(i,y2):ctx.lineTo(i,y2);
          }
          ctx.strokeStyle="rgba(232,227,213,0.92)"; ctx.lineWidth=1.4; ctx.stroke();
          baseline(ctx,w,mid);
        });
        document.getElementById("beatGap").textContent=Df.toFixed(2);
        document.getElementById("beatRate").textContent=Df.toFixed(2);
        var msg;
        if(Df<0.06) msg="Zero gap. The envelope has gone flat, the beat has ceased, and one steady tone remains at doubled amplitude.";
        else if(Df<0.7) msg="A narrow gap. The envelope swells and subsides slowly, and the experience feels smooth and connected.";
        else msg="A wide gap. The envelope flutters, and the content arrives chopped into fragments.";
        document.getElementById("beatMsg").textContent=msg;
      }
      sl.addEventListener("input",render); render();
    }});

  /* 04 two objects */
  SLIDES.push({id:"two", label:"Two Objects", html:
    '<div class="fade">'+
    '<div class="eyebrow">04 &middot; Two Objects</div>'+
    '<h2 class="slide-title">The same silhouette, opposite behaviour</h2>'+
    '<p class="body">Both objects are a carrier inside an envelope, so it is tempting to treat them as one. They are not, '+
    'and they differ on exactly the property Gabor\'s paper is about.</p>'+
    '<div class="grid" style="margin:6px 0 16px 0;">'+
    '<div class="card"><h3 class="card-title" style="color:var(--gold);">The logon</h3><p class="card-text">'+
    'Envelope: a Gaussian bell.<br>Extent in time: <span class="light">bounded, a packet</span>.<br>'+
    'Spectrum: one localised bump.<br>Localisation: maximal. It sits exactly on 1/4&pi;.</p></div>'+
    '<div class="card"><h3 class="card-title" style="color:var(--violet);">The two-tone beat</h3><p class="card-text">'+
    'Envelope: a cosine.<br>Extent in time: <span class="light">unbounded, periodic forever</span>.<br>'+
    'Spectrum: two infinitely sharp lines.<br>Localisation: the opposite extreme in time.</p></div>'+
    '</div>'+
    '<p class="body">So each was doing a different job, and neither substitutes for the other. The beat describes the <span class="light">relational</span> anatomy of a moment: '+
    'two poles, a gap, a phase. The logon describes its <span class="light">episodic</span> anatomy: that it is bounded, and pays for being bounded.</p>'+
    '<div class="note"><span class="tag">An honest correction &middot; </span>Earlier material in this series treated the logon and the beat as the same object. '+
    'They share a silhouette and nothing else, and separating them is what makes the next three slides possible.</div>'+
    '</div>'});

  /* 05 the turn */
  SLIDES.push({id:"turn", label:"The Turn", html:
    '<div class="fade">'+
    '<div class="eyebrow">05 &middot; The Turn</div>'+
    '<h2 class="slide-title">But a moment of experience begins and ends</h2>'+
    '<p class="body">Here is the difficulty, and it is the hinge of this presentation. The beat, taken strictly, never begins and never ends. '+
    'It is a tone that has always been sounding and always will. No moment of experience is like that.</p>'+
    '<p class="body">A v&#7771;tti arises, lasts, and passes. So it carries <span class="light">both</span> anatomies at once: it has two poles, '+
    'and it has edges in time. Giving the relation to one object and the boundedness to another was a convenience, and it hid the question worth asking.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro">the question this presentation answers</div>'+
    '<p class="card-text" style="font-size:16px;color:var(--parchment);line-height:1.7;">'+
    'What has to be true of a moment for the gap between knower and known to be <em>present in it at all</em>?</p>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>If an experience is too brief, there may simply not be enough of it '+
    'for a difference to show up inside it. That is not a metaphor. It is a measurable threshold, and the next slides find it.</div>'+
    '</div>'});

  /* 06 the windowed beat, live */
  SLIDES.push({id:"windowed", label:"The Windowed Beat", html:
    '<div class="fade">'+
    '<div class="eyebrow">06 &middot; The Windowed Beat</div>'+
    '<h2 class="slide-title">What a real moment has to be</h2>'+
    '<p class="body">Take the beat and hold it inside a bounded window, which is the arising and passing of the episode. '+
    'By simple addition this is identically <span class="gold">a pair of logons sharing one window</span>: the two descriptions this series has been using, '+
    'recognised as one object with two dials.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="eq" style="margin-bottom:10px;">R(t) <span class="op">=</span> w(t) <span class="op">&middot;</span> [ A cos(2&pi;f<sub>s</sub>t) <span class="op">+</span> A cos(2&pi;f<sub>m</sub>t) ]</div>'+
    '<canvas id="wbCv" aria-hidden="true"></canvas>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;">'+
    '<div><input type="range" id="wbT" min="0.2" max="3" step="0.01" value="1.3" aria-label="Lengthen or shorten the episode">'+
    '<div class="range-labels"><span>&#8592; brief episode</span><span>long episode &#8594;</span></div></div>'+
    '<div><input type="range" id="wbD" min="0" max="3" step="0.01" value="1.1" aria-label="Open or close the gap">'+
    '<div class="range-labels"><span>&#8592; closed gap</span><span>wide gap &#8594;</span></div></div>'+
    '</div>'+
    '<div class="readout">'+
    '<div><span class="k">window, <span class="nc">T</span></span><span class="v" id="wbTv">1.30</span></div>'+
    '<div><span class="k">gap, <span class="nc">&Delta;f</span></span><span class="v" id="wbDv">1.10</span></div>'+
    '<div><span class="k nc">&Delta;t &middot; &Delta;f</span><span class="v" id="wbP">0.00</span></div>'+
    '<div><span class="k">as a multiple of <span class="nc">1/4&pi;</span></span><span class="v hi" id="wbR">0.00&times;</span></div>'+
    '</div>'+
    '<p class="live" id="wbMsg"></p>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>The dashed bell is the episode: when it starts and when it fades. '+
    'The solid gold line inside it is the beat. Shorten the window and you can see how little of the beat is left to happen.</div>'+
    '</div>',
    init:function(){
      var cv=document.getElementById("wbCv"), sT=document.getElementById("wbT"), sD=document.getElementById("wbD");
      function render(){
        var T=parseFloat(sT.value), Df=parseFloat(sD.value);
        paint(cv,150,function(ctx,w,h){ drawWindowedTime(ctx,w,h,T,Df,10/T); });
        var m=moments(T,Df);
        document.getElementById("wbTv").textContent=T.toFixed(2);
        document.getElementById("wbDv").textContent=Df.toFixed(2);
        document.getElementById("wbP").textContent=m.prod.toFixed(4);
        document.getElementById("wbR").textContent=(m.prod/FLOOR).toFixed(2)+"×";
        var msg="T &middot; &Delta;f = "+(T*Df).toFixed(2)+". ";
        msg+= separable(T,Df)
          ? "The episode is long enough to hold the gap it contains."
          : "The episode is too short to hold the gap it contains, and sits within a whisker of the floor.";
        document.getElementById("wbMsg").innerHTML=msg;
      }
      sT.addEventListener("input",render); sD.addEventListener("input",render); render();
    }});

  /* 07 the spectrum */
  SLIDES.push({id:"spectrum", label:"The Spectrum", html:
    '<div class="fade">'+
    '<div class="eyebrow">07 &middot; The Spectrum</div>'+
    '<h2 class="slide-title">Two lines become two lumps</h2>'+
    '<p class="body">One standard result does all the work from here. Confining a signal in time smears its spectrum, '+
    'and the narrower the confinement the wider the smear. It is the same fact as the piano key: the shorter the note, the vaguer its pitch.</p>'+
    '<p class="body">So the two infinitely sharp lines of the unbounded beat each widen into a lump, '+
    'and the width of each lump is about <span class="gold">1 / T</span>, set by how long the episode ran. '+
    'Not two lines, which needed eternity. Not one bump, which needed a single tone. Two lumps of finite width.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro">the spectrum of a bounded moment</div>'+
    '<canvas id="spCv" aria-hidden="true"></canvas>'+
    '<input type="range" id="spT" min="0.2" max="3" step="0.01" value="2.2" aria-label="Lengthen or shorten the episode and watch the lumps narrow">'+
    '<div class="range-labels"><span>&#8592; brief episode (wide lumps)</span><span>long episode (narrow lumps) &#8594;</span></div>'+
    '<p class="live" id="spMsg"></p>'+
    '</div>'+
    '<div class="note"><span class="tag">The bridge to our work &middot; </span>This is why unbrokenness and purity are one thing rather than two. '+
    'A longer, more continuous engagement is not merely steadier; it is <em>spectrally narrower</em>. Duration is the currency clarity is bought with.</div>'+
    '</div>',
    init:function(){
      var cv=document.getElementById("spCv"), sl=document.getElementById("spT");
      function render(){
        var T=parseFloat(sl.value), Df=1.1;
        paint(cv,150,function(ctx,w,h){ drawWindowedSpectrum(ctx,w,h,T,Df); });
        document.getElementById("spMsg").textContent=
          "Each lump is about "+(1/T).toFixed(2)+" wide, and the two poles are "+Df.toFixed(2)+" apart. "+
          (separable(T,Df) ? "The separation beats the width, so two poles are visible."
                           : "The width has overtaken the separation, so the two have merged into one.");
      }
      sl.addEventListener("input",render); render();
    }});

  /* 08 the threshold, live */
  SLIDES.push({id:"threshold", label:"The Threshold", html:
    '<div class="fade">'+
    '<div class="eyebrow">08 &middot; The Threshold</div>'+
    '<h2 class="slide-title">T &middot; &Delta;f &gt; 1 / &pi;</h2>'+
    '<p class="body">Two lumps are two only if their separation beats their width. That single sentence, applied to a bounded moment, is the result. '+
    'For a Gaussian window it is exact: the spectrum shows two maxima precisely when '+
    '<span class="gold">T &middot; &Delta;f</span> exceeds <span class="gold">1/&pi;</span>, about 0.318. '+
    'In plain terms, the episode has to run for roughly one beat before the gap appears in it at all.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro">shorten the episode and watch the two poles merge</div>'+
    '<canvas id="thCv" aria-hidden="true"></canvas>'+
    '<input type="range" id="thT" min="0.12" max="1.6" step="0.005" value="0.75" aria-label="Shorten the episode below the threshold">'+
    '<div class="range-labels"><span>&#8592; below the floor</span><span>above the floor &#8594;</span></div>'+
    '<div class="readout">'+
    '<div><span class="k nc">T &middot; &Delta;f</span><span class="v hi" id="thP">0.00</span></div>'+
    '<div><span class="k">threshold, <span class="nc">1/&pi;</span></span><span class="v">0.318</span></div>'+
    '<div><span class="k">the two poles</span><span class="v" id="thS">&nbsp;</span></div>'+
    '</div>'+
    '<p class="live" id="thMsg"></p>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>Below the threshold the two poles are still there. '+
    'The gap has not closed. It simply cannot be seen from inside an episode that short, and nothing measured within it can tell the difference.</div>'+
    '</div>',
    init:function(){
      var cv=document.getElementById("thCv"), sl=document.getElementById("thT");
      function render(){
        var T=parseFloat(sl.value), Df=1.0;
        paint(cv,160,function(ctx,w,h){ drawWindowedSpectrum(ctx,w,h,T,Df); });
        var sep=separable(T,Df);
        document.getElementById("thP").textContent=(T*Df).toFixed(3);
        var s=document.getElementById("thS");
        s.textContent=sep?"separable":"merged";
        s.style.color=sep?C.violet:C.dim;
        document.getElementById("thMsg").textContent = sep
          ? "Above the floor. The spectrum has two maxima, so the duality this moment contains is present in it as duality."
          : "Below the floor. The spectrum has a single maximum, so a real gap is indistinguishable from no gap at all.";
      }
      sl.addEventListener("input",render); render();
    }});

  /* 09 the numbers */
  SLIDES.push({id:"numbers", label:"The Numbers", html:
    '<div class="fade">'+
    '<div class="eyebrow">09 &middot; The Numbers</div>'+
    '<h2 class="slide-title">Where the crossover falls</h2>'+
    '<p class="body">Computed by quadrature on the signal itself, and cross-checked in two independent implementations. '+
    'The right-hand column gives the moment\'s time-bandwidth product as a multiple of the floor, so 1.00 means it is sitting exactly on the minimum.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<table class="nums"><thead><tr><th class="nc">T &middot; &Delta;f</th><th>the two poles</th><th><span class="nc">&Delta;t &middot; &Delta;f</span>, as a multiple of <span class="nc">1/4&pi;</span></th></tr></thead><tbody>'+
    '<tr><td class="first">0</td><td>identical</td><td>1.00</td></tr>'+
    '<tr><td class="first">0.25</td><td>merged</td><td>1.01</td></tr>'+
    '<tr><td class="first">0.31</td><td>merged</td><td>1.06</td></tr>'+
    '<tr class="mark"><td class="first" style="color:var(--gold);">0.33</td><td>separable</td><td>1.09</td></tr>'+
    '<tr><td class="first">0.50</td><td>separable</td><td>1.85</td></tr>'+
    '<tr><td class="first">1.00</td><td>separable</td><td>4.55</td></tr>'+
    '<tr><td class="first">2.00</td><td>separable</td><td>8.94</td></tr>'+
    '</tbody></table>'+
    '</div>'+
    '<p class="body" style="margin-top:16px;">Two things in this table matter. The crossover falls exactly where 1/&pi; predicts, between 0.31 and 0.33. '+
    'And the merged region is not a region of small duality: at 0.25 there is a real gap in the signal, and the moment is still within one percent of the floor, '+
    'which is to say indistinguishable from a single pure packet.</p>'+
    '<div class="note"><span class="tag">An honest note &middot; </span>The constant 1/&pi; is exact for a Gaussian window and for the criterion that the spectrum have two maxima. '+
    'A different shape of arising and passing moves it, though not its order of magnitude, and a stricter criterion raises it to about 0.45.</div>'+
    '</div>'});

  /* 10 the piano tuner */
  SLIDES.push({id:"tuner", label:"The Piano Tuner", html:
    '<div class="fade">'+
    '<div class="eyebrow">10 &middot; The Piano Tuner</div>'+
    '<h2 class="slide-title">Near unison, a short note tells you nothing</h2>'+
    '<p class="body">A tuner strikes a fork and a string together and listens, not to either tone, but to the beat between them. '+
    'Far from pitch the beat is a rapid flutter. As the string comes closer the beat slows, and the closer she gets, the longer she has to let the note ring '+
    'for the remaining error to be audible at all.</p>'+
    '<p class="body">Strike a brief staccato note near unison and in tune and slightly out are not hard to tell apart. '+
    'They are <span class="light">indistinguishable</span>. The error is there in the strings, and the note was too short to contain it.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="micro">the same threshold, in a familiar craft</div>'+
    '<div class="rule-row"><div class="rule-key">far off</div><div class="rule-val">Rapid flutter. A short note is plenty, because a wide gap needs very little time to show itself.</div></div>'+
    '<div class="rule-row"><div class="rule-key">closer</div><div class="rule-val">A slow swell. The note must be held longer, because there is less difference to hear and it takes longer to arrive.</div></div>'+
    '<div class="rule-row" style="border-bottom:none;"><div class="rule-key">near unison</div><div class="rule-val">The beat period grows without limit. No brief note can settle the question, and the tuner knows to wait rather than to listen harder.</div></div>'+
    '</div>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>Every tuner already works by this law. The finer the remaining difference, '+
    'the longer the unbroken stretch needed to hear it. That is the whole of the threshold, in a craft that predates the mathematics by centuries.</div>'+
    '</div>'});

  /* 11 what a glimpse cannot tell you */
  SLIDES.push({id:"glimpse", label:"What a Glimpse Cannot Tell You", html:
    '<div class="fade">'+
    '<div class="eyebrow">11 &middot; The Consequence</div>'+
    '<h2 class="slide-title">What a glimpse cannot tell you</h2>'+
    '<p class="body">Many people have had a brief moment in which the sense of separation thins out, and the question naturally follows: was that it?</p>'+
    '<p class="body">The threshold gives an answer that is neither dismissive nor credulous. In a moment too brief to hold the gap, '+
    'a real gap and no gap <span class="light">look exactly the same</span>. So the absence of a felt difference in a brief episode is not evidence that the difference has gone. '+
    'It may be evidence only that the episode was short.</p>'+
    '<div class="grid" style="margin:6px 0 16px 0;">'+
    '<div class="card"><h3 class="card-title">What it does not say</h3><p class="card-text">It does not say the experience was worthless, or imagined, '+
    'or that nothing happened. Something did happen, and it is worth attending to.</p></div>'+
    '<div class="card"><h3 class="card-title">What it does say</h3><p class="card-text">It says a brief moment cannot certify itself. '+
    'The only thing that can tell a small gap from a closed one is a longer stretch of unbroken attention.</p></div>'+
    '</div>'+
    '<div class="note"><span class="tag">The bridge to our work &middot; </span>This is why the tradition treats graded attainment with such care, '+
    'and why it asks for continuity rather than intensity. A glimpse is an invitation. What it is not, and cannot be, is a verdict.</div>'+
    '</div>'});

  /* 12 the ladder */
  SLIDES.push({id:"ladder", label:"The Ladder", html:
    '<div class="fade">'+
    '<div class="eyebrow">12 &middot; The Ladder</div>'+
    '<h2 class="slide-title">Why the stages are ordered as they are</h2>'+
    '<p class="body">Read the threshold from the other side and it says something about practice. '+
    'If a finer gap can only be resolved by a longer unbroken window, then the three stages are not three techniques. '+
    'They are <span class="gold">successive lengthenings of the window</span>.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="rule-row"><div class="rule-key">dh&#257;ra&#7751;&#257;</div><div class="rule-val">Holding attention on one object at all. The window begins to have a length rather than being a flicker.</div></div>'+
    '<div class="rule-row"><div class="rule-key">dhy&#257;na</div><div class="rule-val">Sustaining it unbroken. The window lengthens, and with it what can be resolved inside the moment.</div></div>'+
    '<div class="rule-row" style="border-bottom:none;"><div class="rule-key">sam&#257;dhi</div><div class="rule-val">The gap itself closing, which only a window long enough to resolve it can register as closed.</div></div>'+
    '</div>'+
    '<p class="body" style="margin-top:16px;">So the ordering is not a convention of pedagogy, and the sequence cannot be skipped. '+
    'One cannot bring the gap to zero faster than the window allows the gap to be seen.</p>'+
    '<div class="plain"><span class="tag">In plain words &middot; </span>The instruction was always duration. Not effort, not force, not a better technique. '+
    'Time, unbroken, is the one thing that buys resolution, and there is no shortcut around it.</div>'+
    '</div>'});

  /* 13 an honest note */
  SLIDES.push({id:"honest", label:"An Honest Note", html:
    '<div class="fade">'+
    '<div class="eyebrow">13 &middot; An Honest Note</div>'+
    '<h2 class="slide-title">What is proved, and what is read</h2>'+
    '<p class="body">This presentation rests on three different kinds of claim, and they should not be allowed to blur into one another.</p>'+
    '<div class="card" style="max-width:760px;">'+
    '<div class="rule-row"><div class="rule-key" style="min-width:150px;">established</div><div class="rule-val">'+
    'Gabor\'s limit. That confining a signal in time widens its spectrum. That two lumps separate exactly when T &middot; &Delta;f exceeds 1/&pi; for a Gaussian window. '+
    'That a closed gap lands the product on 1/4&pi;. These are theorems, and they hold whatever anyone believes.</div></div>'+
    '<div class="rule-row"><div class="rule-key" style="min-width:150px;">structural model</div><div class="rule-val">'+
    'Reading the two waves as object and attention, the envelope as the felt clarity of a meeting, and the lengthening window as the three stages of practice. '+
    'These are bridges this course draws. They are useful, and they are readings.</div></div>'+
    '<div class="rule-row" style="border-bottom:none;"><div class="rule-key" style="min-width:150px;">testimony</div><div class="rule-val">'+
    'What the tradition reports from the inside about what happens when the gap closes. That is first-person evidence, offered with respect, '+
    'and it is not a third-person measurement.</div></div>'+
    '</div>'+
    '<div class="note"><span class="tag">Stated plainly &middot; </span>Nothing here shows that mathematics proves a metaphysics, '+
    'or that the tradition anticipated Gabor. The claim is narrower and more interesting: a bounded episode of knowing has a cost, '+
    'that cost is calculable, and the tradition\'s instruction about continuity turns out to be the thing the cost demands.</div>'+
    '</div>'});

  /* 14 close */
  SLIDES.push({id:"close", label:"The Bounded Moment", html:
    '<div class="fade">'+
    '<div class="eyebrow">14 &middot; The Bounded Moment</div>'+
    '<h2 class="slide-title">Duration is the currency</h2>'+
    '<div style="max-width:780px;">'+
    '<div class="arc-row"><div class="arc-num">i</div><div><div class="arc-t">A moment of knowing is an episode</div>'+
    '<div class="arc-g">It begins, lasts and passes. Which means it is not the eternal beat we had been using, and not a packet with no relation inside it. It is both at once.</div></div></div>'+
    '<div class="arc-row"><div class="arc-num">ii</div><div><div class="arc-t">Bounding it widens its spectrum</div>'+
    '<div class="arc-g">Each of the two poles widens to a lump of width about 1/T. The shorter the moment, the wider each one spreads.</div></div></div>'+
    '<div class="arc-row"><div class="arc-num">iii</div><div><div class="arc-t">So duality has a resolution floor</div>'+
    '<div class="arc-g">Below T &middot; &Delta;f = 1/&pi; the two poles merge, and a real gap becomes indistinguishable from no gap. The episode was too short to hold its own difference.</div></div></div>'+
    '<div class="arc-row"><div class="arc-num">iv</div><div><div class="arc-t">A glimpse cannot certify itself</div>'+
    '<div class="arc-g">Which is not a dismissal of glimpses. It is a reason to keep going, and a reason the tradition asks for continuity rather than intensity.</div></div></div>'+
    '<div class="arc-row" style="border-bottom:none;"><div class="arc-num">v</div><div><div class="arc-t">The instruction was always duration</div>'+
    '<div class="arc-g">Unbrokenness is not a stylistic preference of contemplative traditions. It is the one currency that buys resolution, and the mathematics sets its price.</div></div></div>'+
    '<p class="foot-note">Fourth in the Vedanta and Science series, after <em>The Whole Message</em>, <em>The Settling Mind</em> and <em>The Light and the Field</em>, '+

    'That part is still ours to do, one sitting at a time.</p>'+

  /* ---------- shell ---------- */
  var idx=0;
  var stage=document.getElementById("stage");
  var dots=document.getElementById("dots");
  var count=document.getElementById("count");
  var prev=document.getElementById("prev");
  var next=document.getElementById("next");

  SLIDES.forEach(function(s,i){
    var b=document.createElement("button");
    b.className="dot"; b.setAttribute("aria-label",s.label);
    b.addEventListener("click",function(){ go(i); });
    dots.appendChild(b);
  });

  function pad(n){ return String(n).length<2 ? "0"+n : String(n); }

  function render(){
    rafs.forEach(function(r){ cancelAnimationFrame(r); }); rafs=[];
    var s=SLIDES[idx];
    stage.innerHTML=s.html;
    if(s.init) s.init();
    count.textContent=pad(idx+1)+" / "+pad(SLIDES.length)+" · "+s.label;
    Array.prototype.forEach.call(dots.children,function(d,i){
      d.className = i===idx ? "dot on" : "dot";
    });
    prev.disabled = idx===0;
    next.disabled = idx===SLIDES.length-1;
    next.className = idx===SLIDES.length-1 ? "btn" : "btn solid";
  }
  function go(i){ idx=Math.max(0,Math.min(SLIDES.length-1,i)); render(); }

  prev.addEventListener("click",function(){ go(idx-1); });
  next.addEventListener("click",function(){ go(idx+1); });
  window.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"||e.key==="ArrowDown") go(idx+1);
    if(e.key==="ArrowLeft"||e.key==="ArrowUp") go(idx-1);
  });
  var resizeTimer=null;
  window.addEventListener("resize",function(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){
      Array.prototype.forEach.call(document.querySelectorAll("canvas"),function(cv){
        if(cv._render) cv._render();
      });
    },120);
  });

  render();
})();
</script>
